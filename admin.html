<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasserwege Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#333}
header{background:#1a73e8;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.2rem}
#logout-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.9rem}
#login-section{max-width:380px;margin:80px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#login-section h2{margin-bottom:20px;font-size:1.1rem;text-align:center}
.input-group{position:relative;margin-bottom:12px}
.input-group input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:1rem;padding-right:44px}
.input-group input:focus{outline:none;border-color:#1a73e8}
.gen-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;width:auto;font-size:1.1rem;color:#666;display:flex;align-items:center}
.gen-btn:hover{color:#1a73e8}
.gen-btn svg{width:18px;height:18px}
#generated-pwd{font-size:.78rem;color:#555;margin-top:-6px;margin-bottom:10px;padding:6px 10px;background:#f0f4ff;border-radius:6px;display:none;word-break:break-all;cursor:pointer;border:1px dashed #aac}
#generated-pwd:hover{background:#e0ebff}
#generated-pwd span{display:block;font-weight:600;color:#1a73e8}
#generated-pwd small{color:#888}
button.submit-btn{width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
button.submit-btn:hover{background:#1558b0}
#error-msg{color:#d32f2f;font-size:.85rem;margin-top:8px;text-align:center}
#admin-section{display:none;padding:24px}
#admin-section h2{margin-bottom:16px;font-size:1.1rem}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:16px;overflow:hidden}
.card-body{padding:16px}
.card-body strong{font-size:1rem}
.card-meta{font-size:.82rem;color:#666;margin:6px 0}
.card-photo{width:100%;max-height:220px;object-fit:cover;display:block}
.card-actions{display:flex;gap:10px;margin-top:12px}
.btn-approve{flex:1;padding:8px;background:#34a853;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.95rem}
.btn-approve:hover{background:#2d8f47}
.btn-reject{flex:1;padding:8px;background:#ea4335;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.95rem}
.btn-reject:hover{background:#c62828}
.btn-edit{flex:1;padding:8px;background:#fbbc04;color:#333;border:none;border-radius:8px;cursor:pointer;font-size:.95rem}
.btn-edit:hover{background:#e0a800}
.btn-delete{flex:1;padding:8px;background:#ea4335;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.95rem}
.btn-delete:hover{background:#c62828}
.btn-add{padding:8px 20px;background:#1a73e8;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;margin-bottom:16px}
.btn-add:hover{background:#1558b0}
.empty{text-align:center;color:#999;padding:40px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:600;margin-left:8px}
.badge-pending{background:#fff3e0;color:#e65100}
.badge-approved{background:#e8f5e9;color:#2e7d32}
.badge-rejected{background:#fce4ec;color:#b71c1c}
.badge-official{background:#e3f2fd;color:#0d47a1}
.badge-user{background:#f3e5f5;color:#6a1b9a}
.badge-route{background:#e8f5e9;color:#1b5e20}
#filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 16px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-size:.85rem}
.filter-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
#tabs-bar{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #ddd;flex-wrap:wrap}
.tab-btn{padding:10px 20px;border:none;background:none;cursor:pointer;font-size:1rem;color:#666;border-bottom:3px solid transparent}
.tab-btn.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.tab-panel{display:none}
.tab-panel.active{display:block}
/* FIX: hidden attribute overrides display:flex on modal overlays */
.modal-overlay[hidden]{display:none}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:#fff;padding:24px;border-radius:12px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto}
.modal-box h3{margin-bottom:16px}
.modal-box label{display:block;font-size:.85rem;color:#555;margin-bottom:6px;margin-top:12px}
.modal-box input,.modal-box textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:.95rem}
.modal-box textarea{min-height:120px;font-family:monospace;font-size:.82rem;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem}
.modal-save{background:#1a73e8;color:#fff}
.modal-cancel{background:#eee;color:#333}
.route-coords-preview{font-size:.75rem;color:#666;margin-top:4px}
</style>
</head>
<body>
<header>
<h1>Wasserwege — Админ-панель</h1>
<button id="logout-btn" style="display:none" onclick="logout()">Выйти</button>
</header>
<div id="login-section">
<h2>Вход в панель модерации</h2>
<div class="input-group">
<input type="email" id="email-input" placeholder="Email" autocomplete="username">
</div>
<div class="input-group">
<input type="password" id="password-input" placeholder="Пароль" autocomplete="current-password">
<button class="gen-btn" onclick="generatePassword()" title="Сгенерировать безопасный пароль">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
<path d="M9 12l2 2 4-4"/>
</svg>
</button>
</div>
<div id="generated-pwd" onclick="copyPassword()">
<span id="gen-pwd-text"></span>
<small>Нажмите чтобы скопировать · пароль уже вставлен в поле</small>
</div>
<button class="submit-btn" onclick="login()">Войти</button>
<div id="error-msg"></div>
</div>
<div id="admin-section">
<div id="tabs-bar">
<button class="tab-btn active" onclick="setTab('moderation',this)">Заявки на модерации</button>
<button class="tab-btn" onclick="setTab('allpoints',this)">Все точки</button>
<button class="tab-btn" onclick="setTab('routes',this)">Маршруты</button>
</div>

<div id="tab-moderation" class="tab-panel active">
<h2>Заявки на добавление точек</h2>
<div id="filter-bar">
<button class="filter-btn active" onclick="setFilter('pending',this)">Ожидают</button>
<button class="filter-btn" onclick="setFilter('approved',this)">Одобренные</button>
<button class="filter-btn" onclick="setFilter('rejected',this)">Отклонённые</button>
<button class="filter-btn" onclick="setFilter('all',this)">Все</button>
</div>
<div id="points-list"></div>
</div>

<div id="tab-allpoints" class="tab-panel">
<h2>Все точки на карте</h2>
<div id="all-points-list"></div>
</div>

<div id="tab-routes" class="tab-panel">
<h2>Пользовательские маршруты</h2>
<button class="btn-add" onclick="openRouteModal(null)">+ Добавить маршрут</button>
<div id="routes-list"></div>
</div>

</div>

<!-- Edit access point modal -->
<div id="edit-modal" class="modal-overlay" hidden>
<div class="modal-box">
<h3>Редактировать точку</h3>
<label>Название</label>
<input type="text" id="edit-name-input">
<label>Широта (lat)</label>
<input type="text" id="edit-lat-input">
<label>Долгота (lng)</label>
<input type="text" id="edit-lng-input">
<div class="modal-actions">
<button class="modal-cancel" onclick="closeEditModal()">Отмена</button>
<button class="modal-save" onclick="saveEditModal()">Сохранить</button>
</div>
</div>
</div>

<!-- Route modal (create / edit) -->
<div id="route-modal" class="modal-overlay" hidden>
<div class="modal-box">
<h3 id="route-modal-title">Добавить маршрут</h3>
<label>Название маршрута</label>
<input type="text" id="route-name-input" placeholder="Например: Маршрут Альстер — Эльба">
<label>Координаты (JSON-массив [[lat,lng],...])</label>
<textarea id="route-coords-input" placeholder='[[53.55,10.00],[53.56,10.01]]'></textarea>
<div class="route-coords-preview" id="route-coords-hint">Введите минимум 2 точки в формате [[lat,lng],…]</div>
<div class="modal-actions">
<button class="modal-cancel" onclick="closeRouteModal()">Отмена</button>
<button class="modal-save" onclick="saveRouteModal()">Сохранить</button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://illdwjdggnopizqoeaun.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsbGR3amRnZ25vcGl6cW9lYXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NjA2NTQsImV4cCI6MjEwNDQzNjY1NH0.-CDmObhoaZDOQVrzvf2jrRz8z2sk6prY-iYaCEKKJ90';
let sb = null;
let currentFilter = 'pending';
let editingId = null;
let editingRouteId = null;

window.addEventListener('DOMContentLoaded', async () => {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session) showAdmin();
});

function generatePassword() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+';
  const arr = new Uint8Array(20);
  crypto.getRandomValues(arr);
  const pwd = Array.from(arr).map(b => chars[b % chars.length]).join('');
  document.getElementById('password-input').value = pwd;
  document.getElementById('password-input').type = 'text';
  document.getElementById('gen-pwd-text').textContent = pwd;
  const box = document.getElementById('generated-pwd');
  box.style.display = 'block';
  setTimeout(() => { document.getElementById('password-input').type = 'password'; }, 3000);
}

function copyPassword() {
  const pwd = document.getElementById('gen-pwd-text').textContent;
  navigator.clipboard.writeText(pwd).then(() => {
    document.querySelector('#generated-pwd small').textContent = 'Скопировано!';
    setTimeout(() => {
      document.querySelector('#generated-pwd small').textContent = 'Нажмите чтобы скопировать · пароль уже вставлен в поле';
    }, 2000);
  });
}

async function login() {
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('password-input').value;
  const errEl = document.getElementById('error-msg');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Заполните все поля'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  showAdmin();
}

async function logout() {
  await sb.auth.signOut();
  document.getElementById('login-section').style.display = '';
  document.getElementById('admin-section').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('generated-pwd').style.display = 'none';
}

function showAdmin() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('admin-section').style.display = 'block';
  document.getElementById('logout-btn').style.display = '';
  loadPoints();
}

function setTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'allpoints') loadAllPoints();
  if (tab === 'routes') loadRoutes();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadPoints();
}

async function loadPoints() {
  const list = document.getElementById('points-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';
  let query = sb.from('submitted_points').select('*').order('created_at', { ascending: false });
  if (currentFilter !== 'all') query = query.eq('status', currentFilter);
  const { data, error } = await query;
  if (error) { list.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>'; return; }
  if (!data.length) { list.innerHTML = '<div class="empty">Нет заявок</div>'; return; }
  list.innerHTML = data.map(p => renderCard(p)).join('');
}

function renderCard(p) {
  const badges = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' };
  const labels = { pending:'ожидает', approved:'одобрено', rejected:'отклонено' };
  const photo = p.photo_url ? `<img class="card-photo" src="${p.photo_url}" alt="фото" onerror="this.style.display='none'">` : '';
  const actions = p.status === 'pending' ? `
    <div class="card-actions">
      <button class="btn-approve" onclick="moderate('${p.id}','approved')">Одобрить</button>
      <button class="btn-reject" onclick="moderate('${p.id}','rejected')">Отклонить</button>
    </div>` : '';
  const date = new Date(p.created_at).toLocaleString('ru');
  return `<div class="card" id="card-${p.id}">
    ${photo}
    <div class="card-body">
      <strong>${p.name}</strong>
      <span class="badge ${badges[p.status]}">${labels[p.status]}</span>
      <a class="card-meta" href="index.html#${p.lat},${p.lng}" target="_blank" rel="noopener" style="color:#1a73e8;text-decoration:underline">📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</a>
      <div class="card-meta">🕐 ${date}</div>
      ${actions}
    </div>
  </div>`;
}

async function moderate(id, status) {
  const { data: pointData, error: fetchError } = await sb.from('submitted_points').select('*').eq('id', id).single();
  if (fetchError) { alert('Ошибка: ' + fetchError.message); return; }

  const { error } = await sb.from('submitted_points').update({ status }).eq('id', id);
  if (error) { alert('Ошибка: ' + error.message); return; }

  if (status === 'approved' && pointData) {
    const { error: insertError } = await sb.from('access_points').insert([{
      name: pointData.name,
      lat: pointData.lat,
      lng: pointData.lng,
      photo_url: pointData.photo_url
    }]);
    if (insertError) { alert('Точка одобрена, но не добавлена на карту: ' + insertError.message); }
  }

  loadPoints();
}

async function loadAllPoints() {
  const list = document.getElementById('all-points-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';

  let officialPoints = [];
  try {
    const res = await fetch('data/access-points.json');
    const json = await res.json();
    officialPoints = json.points || [];
  } catch (e) {
    console.error('Failed to load official points:', e);
  }

  const { data: userPoints, error } = await sb.from('access_points').select('*').order('created_at', { ascending: false });
  if (error) { list.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>'; return; }

  const officialHtml = officialPoints.map(p => renderOfficialCard(p)).join('');
  const userHtml = (userPoints || []).map(p => renderUserPointCard(p)).join('');

  if (!officialPoints.length && !(userPoints || []).length) {
    list.innerHTML = '<div class="empty">Нет точек</div>';
    return;
  }

  list.innerHTML = userHtml + officialHtml;
}

function renderOfficialCard(p) {
  return `<div class="card">
    <div class="card-body">
      <strong>${p.name}</strong>
      <span class="badge badge-official">официальная</span>
      <a class="card-meta" href="index.html#${p.lat},${p.lng}" target="_blank" rel="noopener" style="color:#1a73e8;text-decoration:underline">📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</a>
      <div class="card-meta" style="color:#999;font-size:.78rem">только чтение — редактируется в data/access-points.json</div>
    </div>
  </div>`;
}

function renderUserPointCard(p) {
  const photo = p.photo_url ? `<img class="card-photo" src="${p.photo_url}" alt="фото" onerror="this.style.display='none'">` : '';
  return `<div class="card" id="apoint-${p.id}">
    ${photo}
    <div class="card-body">
      <strong>${p.name}</strong>
      <span class="badge badge-user">добавлено пользователем</span>
      <a class="card-meta" href="index.html#${p.lat},${p.lng}" target="_blank" rel="noopener" style="color:#1a73e8;text-decoration:underline">📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</a>
      <div class="card-actions">
        <button class="btn-edit" onclick="openEditModal('${p.id}','${escapeAttr(p.name)}',${p.lat},${p.lng})">Ред.</button>
        <button class="btn-delete" onclick="deleteAccessPoint('${p.id}')">Удал.</button>
      </div>
    </div>
  </div>`;
}

function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function openEditModal(id, name, lat, lng) {
  editingId = id;
  document.getElementById('edit-name-input').value = name;
  document.getElementById('edit-lat-input').value = lat;
  document.getElementById('edit-lng-input').value = lng;
  document.getElementById('edit-modal').hidden = false;
}

function closeEditModal() {
  editingId = null;
  document.getElementById('edit-modal').hidden = true;
}

async function saveEditModal() {
  if (!editingId) return;
  const name = document.getElementById('edit-name-input').value.trim();
  const lat = parseFloat(document.getElementById('edit-lat-input').value);
  const lng = parseFloat(document.getElementById('edit-lng-input').value);
  if (!name || isNaN(lat) || isNaN(lng)) { alert('Заполните все поля корректно'); return; }

  const { error } = await sb.from('access_points').update({ name, lat, lng }).eq('id', editingId);
  if (error) { alert('Ошибка: ' + error.message); return; }

  closeEditModal();
  loadAllPoints();
}

async function deleteAccessPoint(id) {
  if (!confirm('Удалить эту точку окончательно?')) return;
  const { error } = await sb.from('access_points').delete().eq('id', id);
  if (error) { alert('Ошибка: ' + error.message); return; }
  loadAllPoints();
}

/* ── ROUTES (custom_waterways) CRUD ── */

async function loadRoutes() {
  const list = document.getElementById('routes-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';
  const { data, error } = await sb.from('custom_waterways').select('*').order('created_at', { ascending: false });
  if (error) { list.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>'; return; }
  if (!data || !data.length) { list.innerHTML = '<div class="empty">Маршрутов пока нет</div>'; return; }
  list.innerHTML = data.map(r => renderRouteCard(r)).join('');
}

function renderRouteCard(r) {
  const coords = r.coordinates || [];
  const pointCount = Array.isArray(coords) ? coords.length : '?';
  const date = r.created_at ? new Date(r.created_at).toLocaleString('ru') : '';
  const firstCoord = Array.isArray(coords) && coords.length > 0 ? coords[0] : null;
  const mapLink = firstCoord
    ? `<a class="card-meta" href="index.html#${firstCoord[0]},${firstCoord[1]}" target="_blank" rel="noopener" style="color:#1a73e8;text-decoration:underline">🗺 Открыть на карте</a>`
    : '';
  return `<div class="card" id="route-${r.id}">
    <div class="card-body">
      <strong>${r.name || 'Без названия'}</strong>
      <span class="badge badge-route">маршрут</span>
      <div class="card-meta">📍 Точек: ${pointCount}</div>
      ${mapLink}
      <div class="card-meta">🕐 ${date}</div>
      <div class="card-actions">
        <button class="btn-edit" onclick="openRouteModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">Ред.</button>
        <button class="btn-delete" onclick="deleteRoute('${r.id}')">Удал.</button>
      </div>
    </div>
  </div>`;
}

function openRouteModal(route) {
  editingRouteId = route ? route.id : null;
  document.getElementById('route-modal-title').textContent = route ? 'Редактировать маршрут' : 'Добавить маршрут';
  document.getElementById('route-name-input').value = route ? (route.name || '') : '';
  const coords = route && route.coordinates ? route.coordinates : [];
  document.getElementById('route-coords-input').value = coords.length ? JSON.stringify(coords, null, 2) : '';
  document.getElementById('route-coords-hint').textContent = 'Введите минимум 2 точки в формате [[lat,lng],…]';
  document.getElementById('route-modal').hidden = false;
}

function closeRouteModal() {
  editingRouteId = null;
  document.getElementById('route-modal').hidden = true;
}

async function saveRouteModal() {
  const name = document.getElementById('route-name-input').value.trim();
  const rawCoords = document.getElementById('route-coords-input').value.trim();
  const hintEl = document.getElementById('route-coords-hint');

  if (!name) { alert('Введите название маршрута'); return; }

  let coordinates;
  try {
    coordinates = JSON.parse(rawCoords);
    if (!Array.isArray(coordinates) || coordinates.length < 2) throw new Error('Нужно минимум 2 точки');
    for (const c of coordinates) {
      if (!Array.isArray(c) || c.length < 2 || typeof c[0] !== 'number' || typeof c[1] !== 'number') {
        throw new Error('Каждая точка должна быть [lat, lng]');
      }
    }
    hintEl.textContent = `✓ ${coordinates.length} точек`;
  } catch (e) {
    hintEl.textContent = '⚠ ' + e.message;
    alert('Ошибка в координатах: ' + e.message);
    return;
  }

  let error;
  if (editingRouteId) {
    ({ error } = await sb.from('custom_waterways').update({ name, coordinates }).eq('id', editingRouteId));
  } else {
    ({ error } = await sb.from('custom_waterways').insert([{ name, coordinates }]));
  }

  if (error) { alert('Ошибка сохранения: ' + error.message); return; }
  closeRouteModal();
  loadRoutes();
}

async function deleteRoute(id) {
  if (!confirm('Удалить маршрут окончательно?')) return;
  const { error } = await sb.from('custom_waterways').delete().eq('id', id);
  if (error) { alert('Ошибка: ' + error.message); return; }
  loadRoutes();
}
</script>
