<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wasserwege - Kayak Hamburg</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div id="controls">
  <select id="lang-select">
    <option value="ru">RU</option>
    <option value="uk">UA</option>
    <option value="de">DE</option>
    <option value="en">EN</option>
  </select>
  <button id="locate-btn">My location</button>
  <button id="add-point-btn">Add point</button>
  <button id="export-points-btn">Export points</button>
  <button id="clear-points-btn">Clear my points</button>
</div>
<div id="legend">
  <div class="legend-title" data-i18n="legend">Legend</div>
  <div class="legend-item"><span class="legend-line navigable"></span><span data-i18n="navigable">Navigable</span></div>
  <div class="legend-item"><span class="legend-line non-navigable"></span><span data-i18n="nonNavigable">Non-navigable</span></div>
  <label class="legend-item legend-toggle">
    <input type="checkbox" id="toggle-non-navigable" checked>
    <span data-i18n="toggleNonNavigable">Show non-navigable</span>
  </label>
  <div class="legend-item"><span class="legend-dot" style="background:green;"></span><span data-i18n="point">Launch/exit point</span></div>
</div>
  <div id="add-point-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 data-i18n="promptPointName">Point name</h3>
    <input type="text" id="add-point-name-input" maxlength="60">
    <div class="modal-actions">
      <button id="add-point-cancel-btn" data-i18n="cancel">Cancel</button>
      <button id="add-point-save-btn" data-i18n="save">Save</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
